tool_name: manage_contacts
description: "Zoek en lees Google-contactgegevens (read-only)."
requires_email: true
google_service: people
operations:

  # searchContacts doorzoekt een door Google onderhouden cache die pas "warm"
  # is na een eerste connections.list-aanroep op dit account — daarvóór geeft
  # search stelselmatig 0 resultaten (geen foutmelding), ook voor contacten
  # die al lang bestaan. Bevestigd via reproductie (2026-08-10): "Hans
  # Stedehouder" gaf 0 hits vóór een list-call, en daarna direct het juiste
  # resultaat voor exact dezelfde query. Draai bij twijfel eerst 'list' één
  # keer per account/sessie om de cache op te warmen.
  search:
    type: list
    description: "zoek contacten op naam, e-mailadres of andere tekst"
    resource: people.searchContacts
    params:
      query:
        type: string
        description: "Zoekterm (naam, e-mailadres, etc.)"
        required: true
      readMask:
        type: string
        description: "Comma-separated velden om terug te geven (Google FieldMask)"
        default: "names,emailAddresses,phoneNumbers,organizations,addresses,birthdays"
      pageSize:
        type: number
        description: "Max aantal resultaten"
        default: 10

  get:
    type: detail
    description: "haal één contact op via resourceName"
    resource: people.get
    params:
      resourceName:
        type: string
        description: "Contact resourceName (bijv. people/c12345) — te vinden via 'search' of 'list'"
        required: true
      personFields:
        type: string
        description: "Comma-separated velden om terug te geven (Google FieldMask)"
        default: "names,emailAddresses,phoneNumbers,organizations,addresses,birthdays"

  # resourceName is altijd 'people/me' — Google's connections.list ondersteunt
  # geen ander resourceName, dus dit staat vast via defaults i.p.v. als param
  # (voorkomt dat de aanroeper er per ongeluk iets anders in zet).
  list:
    type: list
    description: "lijst alle contacten uit het eigen adresboek (paginated)"
    resource: people.connections.list
    defaults:
      resourceName: people/me
    params:
      personFields:
        type: string
        description: "Comma-separated velden om terug te geven (Google FieldMask)"
        default: "names,emailAddresses,phoneNumbers,organizations"
      pageSize:
        type: number
        description: "Max resultaten per pagina (default 25, max 1000)"
        default: 25
        max: 1000

  listGroups:
    type: list
    description: "lijst contactgroepen/labels"
    resource: contactGroups.list

  # Schrijfoperatie (2026-08-10, bewust toegevoegd — zie oauth.ts voor de
  # bijbehorende scope-uitbreiding). resourceNamesToAdd komt bij Google aan als
  # een array in de body; contactGroups.members.modify declareert in de
  # descriptor alleen 'resourceName' als path-param, dus resourceNamesToAdd
  # gaat vanzelf naar de body (zie client.ts splitParams) — patch.ts's
  # beforeExecute-hook zet de hier binnenkomende comma-separated string om
  # naar een array vlak vóór de aanroep.
  addToGroup:
    type: action
    description: "voeg contacten toe aan een contactgroep/label (batch)"
    resource: contactGroups.members.modify
    params:
      resourceName:
        type: string
        description: "Contactgroep resourceName (bijv. contactGroups/xxxx) — via 'listGroups' te vinden"
        required: true
      resourceNamesToAdd:
        type: string
        description: "Comma-separated people-resourceNames om toe te voegen (bijv. people/c123,people/c456)"
        required: true
